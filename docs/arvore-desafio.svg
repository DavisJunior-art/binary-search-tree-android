<text x="120" y="250">10</text><text x="360" y="250">22</text><text x="600" y="250">35</text><text x="840" y="250">70</text>
<text x="60" y="350">4</text><text x="180" y="350">12</text><text x="300" y="350">18</text><text x="420" y="350">24</text><text x="540" y="350">31</text><text x="660" y="350">44</text><text x="780" y="350">66</text><text x="900" y="350">90</text>
</g>
<text x="480" y="420" fill="#657670" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Inserção sequencial: 25, 15, 50, 10, 22, 35, 70, 4, 12, 18, 24, 31, 44, 66, 90</text>
